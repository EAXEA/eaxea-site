name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Production route checks
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3210 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3210/ > /dev/null; then break; fi
            sleep 1
          done
          TEST_BASE_URL=http://127.0.0.1:3210 npm test
